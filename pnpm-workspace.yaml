allowBuilds:
  esbuild: true

overrides:
  '@babel/runtime@<7.26.10': '>=7.26.10'
  cross-spawn@<6.0.6: '>=6.0.6'
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.5'
  node-fetch@<2.6.7: '>=2.6.7'
  nth-check@<2.0.1: '>=2.0.1'
  plist@<3.0.5: '>=3.0.5'
  semver@<5.7.2: '>=5.7.2'
  semver@>=7.0.0 <7.5.2: '>=7.5.2'
  trim-newlines@<3.0.1: '>=3.0.1'
  "@xmldom/xmldom": '0.9.12'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
  brace-expansion@<1.1.21: ^1.1.21
  fast-uri@>=3.0.0 <3.1.9: ^4.0.0
  js-yaml@<3.15.0: ^3.15.0
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  lodash@>=4.0.0 <=4.17.23: ^4.18.1
  minimatch@<3.1.4: ^11.0.0
  svgo@>=1.0.0 <2.8.4: ^2.8.4
  uuid@<11.1.1: ^11.1.1
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.1.0
  vite-plus: 1.5.0
  '@vitest/coverage-v8': 5.1.0
  '@vitest/ui': 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
versioning:
  changelog:
    # Keeps `CHANGELOG.md` in the repository, where the Release workflow reads the release notes.
    storage: repository
